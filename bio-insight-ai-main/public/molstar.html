<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Structure</title>
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/molstar@4.6.0/build/viewer/molstar.css" />
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #fff; overflow: hidden; }
        #app { position: absolute; inset: 0; }
        .msp-plugin .msp-layout-standard { border: none !important; }
        .err {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; color: #52525b; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            text-align: center; padding: 24px;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/molstar@4.6.0/build/viewer/molstar.js"></script>
    <script>
        async function init() {
            const params = new URLSearchParams(location.search);
            const explicitUrl = params.get('url');
            const format = (params.get('format') || 'pdb').toLowerCase();
            let id = params.get('id');

            try {
                const viewer = await molstar.Viewer.create('app', {
                    layoutIsExpanded: false,
                    layoutShowControls: false,
                    layoutShowRemoteState: false,
                    layoutShowSequence: false,
                    layoutShowLog: false,
                    layoutShowLeftPanel: false,
                    viewportShowExpand: false,
                    viewportShowAnimation: false,
                    pdbProvider: 'rcsb',
                });

                // Preferred path: the API already resolved a concrete coordinates URL.
                if (explicitUrl) {
                    const fmt = format === 'mmcif' || format === 'cif' ? 'mmcif' : 'pdb';
                    await viewer.loadStructureFromUrl(explicitUrl, fmt);
                    return;
                }

                // Fallback path: resolve from an identifier client-side.
                if (!id) throw new Error('no identifier');
                if (/^[0-9][A-Za-z0-9]{3}$/.test(id)) {
                    await viewer.loadPdb(id.toLowerCase());
                    return;
                }
                // Assume UniProt accession -> AlphaFold model.
                await viewer.loadStructureFromUrl(
                    `https://alphafold.ebi.ac.uk/files/AF-${id}-F1-model_v4.cif`,
                    'mmcif'
                );
            } catch (err) {
                console.error('Mol* load failed:', err);
                document.getElementById('app').innerHTML =
                    '<div class="err"><strong>Structure unavailable</strong>' +
                    '<p>Could not load a 3D model for this entry.</p></div>';
            }
        }
        window.addEventListener('load', init);
    </script>
</body>
</html>
