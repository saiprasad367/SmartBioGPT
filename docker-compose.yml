# =========================================================================
#  Smart Bio GPT - full distributed system, one command:
#
#      cp .env.example .env   &&   docker compose up --build
#
#  Then open http://localhost:${GATEWAY_PORT:-8080}
#
#  Topology:
#      browser -> gateway (nginx) --+--> frontend        (static SPA)
#                                   +--> auth-service     :4001
#                                   +--> bio-service      :4002
#                                   +--> chat-service     :4003
#      auth/chat -> postgres :5432        all services -> redis :6379
# =========================================================================

name: smart-bio-gpt

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [sbg]
  environment: &common-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
    REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${GATEWAY_PORT:-8080}}
    APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:${GATEWAY_PORT:-8080}}
    HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-12000}
    HTTP_RETRIES: ${HTTP_RETRIES:-2}
    # trusted proxy hops: 1 = gateway only (local); 2 = behind Caddy/ALB (prod)
    TRUST_PROXY: ${TRUST_PROXY:-1}

services:
  # ---------------------------------------------------------------- data
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [sbg]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartbio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartbiogpt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartbio} -d ${POSTGRES_DB:-smartbiogpt}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [sbg]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ------------------------------------------------------------- schema
  migrator:
    image: postgres:16-alpine
    networks: [sbg]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db:/db:ro
    entrypoint: ["psql"]
    command:
      - "-h"
      - "postgres"
      - "-U"
      - "${POSTGRES_USER:-smartbio}"
      - "-d"
      - "${POSTGRES_DB:-smartbiogpt}"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-f"
      - "/db/schema.sql"
    restart: "no"

  # --------------------------------------------------------- microservices
  auth-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: auth-service
      PORT: "4001"
      DATABASE_URL: postgres://${POSTGRES_USER:-smartbio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartbiogpt}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Smart Bio GPT <no-reply@smartbiogpt.ai>}
      MAIL_SIGNATURE_NAME: ${MAIL_SIGNATURE_NAME:-Saiprasad}
      MAIL_SIGNATURE_TITLE: ${MAIL_SIGNATURE_TITLE:-Creator, Smart Bio GPT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  bio-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/bio-service/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: bio-service
      PORT: "4002"
      CHAT_SERVICE_URL: http://chat-service:4003
      BIO_CACHE_TTL_MS: ${BIO_CACHE_TTL_MS:-21600000}
    depends_on:
      redis:
        condition: service_healthy

  chat-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: chat-service
      PORT: "4003"
      DATABASE_URL: postgres://${POSTGRES_USER:-smartbio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartbiogpt}
      BIO_SERVICE_URL: http://bio-service:4002
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-minimax/minimax-m3:free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-1200}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # --------------------------------------------------------------- edge
  frontend:
    build:
      context: ./bio-insight-ai-main
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    networks: [sbg]

  gateway:
    build:
      context: .
      dockerfile: infra/gateway/Dockerfile
    restart: unless-stopped
    networks: [sbg]
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - frontend
      - auth-service
      - bio-service
      - chat-service

networks:
  sbg:
    driver: bridge

volumes:
  pgdata:
  redisdata:
