worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Docker's embedded DNS - lets us use variables in proxy_pass so nginx
    # starts even if an upstream is briefly unavailable, and re-resolves it.
    resolver 127.0.0.11 ipv6=off valid=10s;

    log_format main '$remote_addr - $status "$request" '
                    '-> $upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    server {
        listen 8080;
        server_name _;

        set $auth_service "http://auth-service:4001";
        set $bio_service  "http://bio-service:4002";
        set $chat_service "http://chat-service:4003";
        set $frontend     "http://frontend:80";

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout    75s;
        proxy_send_timeout    75s;

        # never expose service-to-service endpoints
        location /internal/ { return 404; }

        location = /api/health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location /api/auth/      { proxy_pass $auth_service; }
        location /api/bio/       { proxy_pass $bio_service; }
        location /api/structure/ { proxy_pass $bio_service; }
        location /api/chat       { proxy_pass $chat_service; }
        location /api/user/      { proxy_pass $chat_service; }

        # SPA + static assets
        location / {
            proxy_pass $frontend;
        }
    }
}
